[package]
name = "phone-media"
version = "1.1.0"
edition = "2024"
default-run = "phone-media"

[dependencies]
base64 = "0.23.1"
getrandom = "0.4.3"
hmac = "0.13.0"
if-addrs = "0.15.0"
p256 = { version = "0.14.0", features = ["ecdh", "getrandom"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
windows = { version = "0.62.2", features = ["Foundation", "Media", "Media_Playback", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_SystemInformation", "ApplicationModel", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Storage_EnhancedStorage", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Security", "Win32_System_Diagnostics_Debug"] }

[build-dependencies]
winresource = "0.1.34"
